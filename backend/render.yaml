services:
  - type: web
    name: autograph-api
    env: docker
    region: ohio
    rootDir: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autograph-db
          property: connectionString
      - key: PORT
        value: "3000"
      - key: OPENAI_API_KEY
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: USE_MOCK_WHATSAPP
        value: "false"

databases:
  - name: autograph-db
    region: ohio
    plan: free
    databaseName: autograph
    user: autograph_user
