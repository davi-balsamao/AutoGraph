name: autograph
description: "AutoGraph — Plataforma de gestão inteligente para gráficas (Flutter + Node.js + LangChain)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  shared_preferences: ^2.5.3
  fl_chart: ^1.0.0
  intl: ^0.20.2
  google_fonts: ^8.1.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  socket_io_client: ^2.0.3
  flutter_svg: ^2.0.10


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
